<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Pane</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bar">
      <div class="left">
        <div id="desktops" class="desktops" data-move="desktops" role="group" aria-label="Virtual desktops"></div>
        <div id="media" class="media" data-move="media" hidden></div>
        <button id="claude" class="claude" data-move="claude" hidden></button>
        <button id="codex" class="claude codex" data-move="codex" hidden></button>
        <button id="docker" class="docker" data-move="docker" hidden></button>
        <button id="update" class="update" hidden></button>
        <button id="notice" class="notice" hidden></button>
      </div>
      <div class="center">
        <button id="start" class="start" aria-label="Start">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="start-fill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9eeaff" />
                <stop offset="1" stop-color="#1d8bff" />
              </linearGradient>
            </defs>
            <g fill="url(#start-fill)">
              <rect x="1.5" y="1.5" width="9.8" height="9.8" rx="2" />
              <rect x="12.7" y="1.5" width="9.8" height="9.8" rx="2" />
              <rect x="1.5" y="12.7" width="9.8" height="9.8" rx="2" />
              <rect x="12.7" y="12.7" width="9.8" height="9.8" rx="2" />
            </g>
          </svg>
        </button>
        <div id="apps" class="apps"></div>
      </div>
      <div class="right">
        <button id="custom" class="custom" data-move="custom" hidden></button>
        <button id="awake" class="awake" data-move="awake"></button>
        <button id="usage" class="usage" data-move="usage" aria-label="System load, opens Task Manager"></button>
        <div class="tray-zone" data-move="tray">
          <button id="overflow" class="overflow-arrow" aria-label="Show hidden icons" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" /></svg>
          </button>
          <div id="tray" class="tray"></div>
        </div>
        <div id="status" class="status" data-move="status"></div>
        <div class="time-block" data-move="clock">
          <button id="clock" class="clock" aria-label="Notifications and calendar">
            <span id="date" class="date"></span>
            <span id="time" class="time"></span>
          </button>
          <button id="weather" class="weather" hidden></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
